<!DOCTYPE html>
<html lang="en">
<body>

    <div id="myElement">
        <p>Welcome to my website!</p>
    </div>

    <script>
        // Select the <p> element inside the <div> with id="myElement"
        const paragraph = document.querySelector("#myElement p");
        // Change the <p> content
        paragraph.textContent = "Hello there!";
    </script>

</body>
</html>
