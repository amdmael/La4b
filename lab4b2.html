<!DOCTYPE html>
<html lang="en">
<body>
    <input type="text" id="userInput" placeholder="Enter a number"> 
    <button onclick="checkInput()">Check</button>

    <script>
        function checkInput() {
            // Get the text value from the input field and remove extra spaces
            const rawValue = document.getElementById("userInput").value.trim();
            
            // Convert the input into a number
            const number = Number(rawValue);

            // Check if the input is empty or Not-a-Number (e.g., alphabets)
            if (rawValue === "" || isNaN(number)) {
                alert("Please insert a number!");
            } else if (number < 10) {
                alert("The number is lower than 10");
            } else {
                alert("The number is higher than 10");
            }
        }
    </script>

</body>
</html>
